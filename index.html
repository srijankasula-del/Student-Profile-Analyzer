<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Student Manager</title>
    <style>
        /* --- MODERN CSS VARIABLES & RESET --- */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 2rem;
        }

        /* --- LAYOUT & HEADER --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary);
        }

        /* --- DASHBOARD STATS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 0.5rem;
        }

        /* --- MAIN CONTENT GRID --- */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 860px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* --- FORM STYLES --- */
        .panel {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
        }

        /* --- TOOLBAR (Search & Sort) --- */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .toolbar input { flex: 2; }
        .toolbar select { flex: 1; }

        /* --- STUDENT CARDS GRID --- */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }

        .pass-indicator { background-color: var(--success); }
        .fail-indicator { background-color: var(--danger); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-header h3 { font-size: 1.1rem; }
        .card-header p { font-size: 0.875rem; color: var(--text-muted); }

        .score-display {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
        }

        /* --- INTERACTIVE BUTTONS --- */
        .card-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .action-btn:hover { background: var(--background); }
        .btn-delete:hover { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
        
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Student Hub</h1>
                <p style="color: var(--text-muted);">Interactive Performance Dashboard</p>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Students</h3>
                <div id="stat-total" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Class Average</h3>
                <div id="stat-avg" class="value">0%</div>
            </div>
            <div class="stat-card">
                <h3>Top Performer</h3>
                <div id="stat-top" class="value">-</div>
            </div>
        </div>

        <div class="main-grid">
            <aside>
                <div class="panel">
                    <h2>Add New Student</h2>
                    <form id="student-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="e.g. Jane Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" placeholder="e.g. 21" required>
                        </div>
                        <div class="form-group">
                            <label for="score">Score (0-100)</label>
                            <input type="number" id="score" placeholder="e.g. 88" required max="100" min="0">
                        </div>
                        <button type="submit" class="btn-primary">+ Register Student</button>
                    </form>
                </div>
            </aside>

            <main>
                <div class="toolbar">
                    <input type="text" id="search-bar" placeholder="🔍 Search students by name...">
                    <select id="sort-select">
                        <option value="default">Sort By: Default</option>
                        <option value="score-high">Score: High to Low</option>
                        <option value="score-low">Score: Low to High</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </div>
                
                <div id="student-container" class="students-grid">
                    </div>
            </main>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. DATA MODEL (Classes)
        // ==========================================
        class Student {
            constructor(id, name, age, score) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.score = score;
            }
            hasPassed() { return this.score >= 60; }
        }

        // State variables
        let studentData = [];
        let searchQuery = "";
        let currentSort = "default";

        // ==========================================
        // 2. LOCAL STORAGE MANAGEMENT
        // ==========================================
        const saveToLocalStorage = () => {
            // Convert array of objects to JSON string
            localStorage.setItem('studentHubData', JSON.stringify(studentData));
        };

        const loadFromLocalStorage = () => {
            const storedData = localStorage.getItem('studentHubData');
            if (storedData) {
                // Parse JSON back to objects, then map them back into Student Class instances
                // so they regain access to the hasPassed() method
                const parsedData = JSON.parse(storedData);
                studentData = parsedData.map(data => new Student(data.id, data.name, data.age, data.score));
            } else {
                // Default data if first time loading
                studentData = [
                    new Student(1, "Alex Johnson", 20, 85),
                    new Student(2, "Sarah Smith", 22, 45),
                    new Student(3, "Mike Chen", 21, 95)
                ];
                saveToLocalStorage();
            }
        };

        // ==========================================
        // 3. INTERACTIVE FEATURES (Mutating Data)
        // ==========================================
        const deleteStudent = (id) => {
            // Array Filter: Keep everyone EXCEPT the matching ID
            studentData = studentData.filter(student => student.id !== id);
            saveToLocalStorage();
            renderApp();
        };

        const updateScore = (id, change) => {
            // Array FindIndex: Locate the exact student
            const index = studentData.findIndex(student => student.id === id);
            if (index !== -1) {
                let newScore = studentData[index].score + change;
                // Keep score between 0 and 100
                if (newScore > 100) newScore = 100;
                if (newScore < 0) newScore = 0;
                
                studentData[index].score = newScore;
                saveToLocalStorage();
                renderApp();
            }
        };

        // ==========================================
        // 4. RENDERING & UI UPDATES
        // ==========================================
        const updateDashboardStats = (filteredStudents) => {
            document.getElementById("stat-total").innerText = filteredStudents.length;

            if (filteredStudents.length === 0) {
                document.getElementById("stat-avg").innerText = "0%";
                document.getElementById("stat-top").innerText = "-";
                return;
            }

            // Calculate Average using Reduce
            const totalScore = filteredStudents.reduce((sum, st) => sum + st.score, 0);
            document.getElementById("stat-avg").innerText = Math.round(totalScore / filteredStudents.length) + "%";

            // Find Top Student using Reduce
            const topStudent = filteredStudents.reduce((top, current) => (current.score > top.score) ? current : top);
            document.getElementById("stat-top").innerText = topStudent.name;
        };

        const renderApp = () => {
            // 1. Apply Search Filter
            let displayData = studentData.filter(student => 
                student.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // 2. Apply Sorting
            if (currentSort === "score-high") {
                displayData.sort((a, b) => b.score - a.score);
            } else if (currentSort === "score-low") {
                displayData.sort((a, b) => a.score - b.score);
            } else if (currentSort === "name") {
                displayData.sort((a, b) => a.name.localeCompare(b.name));
            }

            // 3. Update Stats
            updateDashboardStats(displayData);

            // 4. Render Cards
            const container = document.getElementById("student-container");
            
            if (displayData.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">No students match your criteria.</p>`;
                return;
            }

            container.innerHTML = displayData.map(student => {
                const statusClass = student.hasPassed() ? "pass-indicator" : "fail-indicator";
                const statusColor = student.hasPassed() ? "var(--success)" : "var(--danger)";
                const statusText = student.hasPassed() ? "PASSING" : "FAILING";

                return `
                    <div class="student-card">
                        <div class="status-indicator ${statusClass}"></div>
                        <div class="card-header">
                            <div>
                                <h3>${student.name}</h3>
                                <p>Age: ${student.age}</p>
                            </div>
                            <span style="font-size: 0.75rem; font-weight: bold; color: ${statusColor};">${statusText}</span>
                        </div>
                        
                        <div class="score-display">
                            ${student.score}<span style="font-size: 1rem; color: var(--text-muted);">/100</span>
                        </div>

                        <div class="card-actions">
                            <button class="action-btn" onclick="updateScore(${student.id}, -5)">-5 Pts</button>
                            <button class="action-btn" onclick="updateScore(${student.id}, 5)">+5 Pts</button>
                            <button class="action-btn btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // ==========================================
        // 5. EVENT LISTENERS
        // ==========================================
        const setupEventListeners = () => {
            // Form Submit
            document.getElementById("student-form").addEventListener("submit", (e) => {
                e.preventDefault(); 
                const name = document.getElementById("name").value.trim();
                const age = parseInt(document.getElementById("age").value);
                const score = parseInt(document.getElementById("score").value);

                const newStudent = new Student(Date.now(), name, age, score);
                studentData.push(newStudent);
                
                saveToLocalStorage();
                renderApp();
                e.target.reset();
            });

            // Search Input
            document.getElementById("search-bar").addEventListener("input", (e) => {
                searchQuery = e.target.value;
                renderApp();
            });

            // Sort Dropdown
            document.getElementById("sort-select").addEventListener("change", (e) => {
                currentSort = e.target.value;
                renderApp();
            });
        };

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        const init = () => {
            loadFromLocalStorage();
            setupEventListeners();
            renderApp();
        };

        // Start the app
        init();
    </script>
</body>
</html>
